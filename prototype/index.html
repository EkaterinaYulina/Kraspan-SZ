<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Структура сайта Краспан СЗ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('kr-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--on:#fff;--phl:var(--phl);--ins:#eceef0;--dot:#9aa1a8;--bg:#fff;--fg:#1b1d1f;--mut:#6a7178;--line:#d3d7db;--fill:#f1f3f4;--panel:#e4e7ea;--acc:#c8102e;--accbg:#fbe9ec}
html{color-scheme:light}
:root[data-theme=dark]{--on:#121416;--phl:#4b5258;--ins:#202428;--dot:#5f676e;--bg:#121416;--fg:#e9ecee;--mut:#9aa1a8;--line:#33383d;--fill:#1a1d20;--panel:#262a2e;--accbg:#3a1a20;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 Geologica,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.proto{background:var(--fill);font-size:12px;color:var(--mut)}
.proto .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:7px 24px}
.proto a{cursor:pointer;text-decoration:underline;color:var(--fg)}
.proto label{margin-left:auto;cursor:pointer;user-select:none}
header{background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:stretch;gap:28px;min-height:68px}
.logo{display:flex;align-items:center;font-weight:600;letter-spacing:.02em;cursor:pointer;font-size:17px;white-space:nowrap}
.logo b{color:var(--acc);font-weight:600;margin-left:6px}
nav{display:flex;flex:1;align-items:stretch}
.nv .nl{display:flex;align-items:center;height:100%;padding:0 16px;cursor:pointer;text-decoration:none;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.nv.open .nl{background:var(--fill)}
.nv.on .nl{border-bottom-color:var(--acc)}
.mega{display:block;visibility:hidden;opacity:0;transform:translateY(-6px);pointer-events:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);padding:30px 0 38px;transition:opacity .16s ease,transform .16s ease,visibility 0s .16s}
.nv.open .mega{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition:opacity .16s ease,transform .16s ease,visibility 0s}
.mg3{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.mg2{display:grid;grid-template-columns:1fr}
.mc a{display:block;padding:3px 0;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--mut)}
.mc a:hover{color:var(--acc)}
.mc .mh{font-size:15px;font-weight:500;color:var(--fg);margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mg2 .mc{columns:2;column-gap:40px}.mg2 .mc .mh{column-span:all}
.cont{display:flex;flex-direction:column;justify-content:center;font-size:12.5px;text-align:right;line-height:1.35;white-space:nowrap}
.cont b{font-weight:500;font-size:14px}
.hdr-cta{display:flex;align-items:center}
.btn{background:var(--acc);color:#fff;border:1px solid var(--acc);padding:11px 20px;border-radius:0;cursor:pointer;font:500 14px Geologica,system-ui,sans-serif}
.btn:hover{background:#a40d26;border-color:#a40d26}
.btn.alt{background:none;color:var(--fg);border-color:var(--fg)}
.btn.alt:hover{background:var(--fg);color:var(--on)}
.crumbs{font-size:12.5px;color:var(--mut);padding:26px 0 0}
.crumbs a{cursor:pointer;text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:14px 0 10px}
h1{font-weight:300;font-size:clamp(32px,5vw,54px);line-height:1.06;letter-spacing:-.02em;margin:0;max-width:900px}
.note{font-size:12.5px;line-height:1.5;color:var(--mut);margin:8px 0 0;padding-left:10px;border-left:2px solid var(--line)}
.note.how{border-left-style:dashed}
body.nonotes .note{display:none}
.ph{position:relative;background:var(--panel);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;overflow:hidden;
 background-image:linear-gradient(to top right,transparent calc(50% - .5px),var(--phl) calc(50% - .5px),var(--phl) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),var(--phl) calc(50% - .5px),var(--phl) calc(50% + .5px),transparent calc(50% + .5px))}
.ph span{background:var(--panel);padding:3px 10px}
.ph.tall{aspect-ratio:4/5}
.hero{position:relative;margin:22px 0 0}
.hero .ph{aspect-ratio:21/9;min-height:320px;align-items:flex-start;justify-content:flex-end;padding:16px}
.hero .plate{position:absolute;left:0;bottom:-56px;background:var(--bg);padding:40px 48px 40px 0;max-width:720px}
.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.02}
.hero p{margin:18px 0 24px;font-size:17px;color:var(--mut)}
.hero+.rows{margin-top:110px}
.row{display:grid;grid-template-columns:250px 1fr;gap:36px;padding:34px 0}
.row.solo{grid-template-columns:1fr}
.rh{align-self:start;position:sticky;top:88px}
.row.solo .rh{position:static}
.rh h3{margin:0;font-size:16px;font-weight:500;line-height:1.3}
.tiles{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tiles.lg{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.tl{display:block;cursor:pointer;text-decoration:none}
.tl .ph{transition:background-color .15s}
.tl:hover .ph{background-color:color-mix(in srgb,var(--panel),var(--fg) 8%)}
.tl:hover .ph span{background:color-mix(in srgb,var(--panel),var(--fg) 8%)}
.tl .cap{padding:9px 2px 14px;font-size:13.5px;line-height:1.35}
.tl:hover .cap{color:var(--acc)}
.tl small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:36px}
.lists h4{margin:0 0 8px;font-size:16px;font-weight:500;cursor:pointer}
.lists a{display:block;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--mut)}
.lists a:hover{color:var(--acc)}
.chips{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.chips .ph{aspect-ratio:16/10}
.chips .cap{padding:9px 2px 14px;font-size:13px;color:var(--mut)}
.chips .cap b{display:block;color:var(--fg);font-weight:500;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns+.btns,.tiles+.btns,.chips+.btns{margin-top:18px}
.txt{font-size:19px;font-weight:300;line-height:1.5;max-width:680px;margin:0}
footer{border-top:1px solid var(--line);margin-top:48px;padding:26px 0 40px;color:var(--mut);font-size:12.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--on);padding:10px 16px;font-size:14px;display:none;z-index:20}
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.ov.show{display:flex}
.modal{background:var(--bg);padding:28px;max-width:420px;width:100%}
.modal h2{margin:0 0 16px;font-size:24px;font-weight:300}
.fld{border:1px solid var(--line);padding:10px 12px;margin:0 0 8px;color:var(--mut);font-size:14px}
.modal .btn{margin-top:8px}
.nd{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);background:var(--bg);font-size:13px;cursor:pointer;line-height:1.3}
.nd:hover{border-color:var(--acc);color:var(--acc)}
.nd i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--on);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.nd em{font-style:normal;color:var(--mut);font-size:12px}
.nd.l1{background:var(--fg);color:var(--on);border-color:var(--fg);font-weight:500;font-size:15px;padding:9px 14px}
.nd.l1 i{background:var(--on);color:var(--fg)}
.nd.l2{background:var(--fill);font-weight:500;font-size:14px}
.tree{margin-top:26px}
.tree ul{list-style:none;margin:0;padding:0 0 0 22px}
.tree .root{margin-bottom:6px}
.tree>ul>li{position:relative;padding:6px 0 10px 24px;border-left:2px solid var(--line)}
.tree>ul>li::before{content:"";position:absolute;left:-2px;top:0;width:22px;height:22px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:8px;margin-top:-1px}
.tree>ul>li.last{border-left-color:transparent}
.tree>ul>li.last::before{border-left-color:var(--line)}
.leaves{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin:10px 0 0 6px;padding-left:16px;border-left:2px solid var(--line)}

.p0{background-image:repeating-linear-gradient(90deg,transparent 0 13px,var(--ln) 13px 14px)}
.p1{background-image:repeating-linear-gradient(0deg,transparent 0 13px,var(--ln) 13px 14px)}
.p2{background-image:repeating-linear-gradient(0deg,transparent 0 33px,var(--ln) 33px 34px)}
.p3{background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:60px 60px}
.p4{background-image:repeating-linear-gradient(45deg,transparent 0 11px,var(--ln) 11px 12px)}
.p5{background-image:radial-gradient(var(--ln) 1.5px,transparent 2px);background-size:16px 16px}
.p6{background-image:repeating-linear-gradient(-45deg,transparent 0 11px,var(--ln) 11px 12px)}
.p7{background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:16px 16px}
.p8{background-image:repeating-linear-gradient(0deg,transparent 0 19px,var(--ln) 19px 20px),repeating-linear-gradient(90deg,transparent 0 59px,var(--ln) 59px 60px)}
.p9{background-image:repeating-linear-gradient(0deg,transparent 0 17px,var(--ln) 17px 18px),repeating-linear-gradient(90deg,transparent 0 39px,var(--ln) 39px 40px)}
.row.wide{grid-template-columns:1fr;gap:18px}.row.wide .rh{position:static}


.stage{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.stage.cmp{grid-template-columns:1fr}
.rail{display:flex;flex-direction:column;gap:2px}
.stage.cmp .rail{flex-direction:row;flex-wrap:wrap;gap:6px;order:2}
.sw{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;border:1px solid transparent;background:none;text-align:left;font:13px/1.3 Geologica,system-ui,sans-serif;cursor:pointer;color:var(--fg)}
.sw:hover,.sw.on{border-color:var(--fg)}
.sw u{flex:none;width:28px;height:28px;background-color:var(--panel);--ln:#aab0b6}
.stage.cmp .sw{padding:3px}.stage.cmp .sw span{display:none}.stage.cmp .sw u{width:34px;height:34px}
.scene{position:relative;height:580px;perspective:1900px;perspective-origin:50% 35%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage.cmp .scene{height:520px}
.bld{position:relative;width:320px;height:400px;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.7,0,.25,1)}
.lyr{--ln:#b0b6bc;position:absolute;inset:0;outline:1.5px solid var(--fg);transition:transform 1.5s cubic-bezier(.7,0,.25,1)}
.lyr::before,.lyr::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0}
.win{position:absolute;width:80px;height:80px;background:var(--bg);border:2px solid var(--fg);z-index:1;box-sizing:border-box}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--fg) 1px,transparent 1px) 0 50%/100% 100% no-repeat,linear-gradient(90deg,var(--fg) 1px,transparent 1px) 50% 0/100% 100% no-repeat;opacity:.4}
.lyr.wl{background-color:var(--panel);transform:translateZ(0)}
.lyr.in{background-color:var(--ins);background-image:radial-gradient(var(--dot) 1.6px,transparent 2px);background-size:10px 10px;transform:translateZ(5px)}
.lyr.fr{--fw:2px;background:none;transform:translateZ(10px)}
.lyr.fr::before{background:repeating-linear-gradient(90deg,var(--fg) 0 var(--fw),transparent var(--fw) 40px)}
.lyr.fr::after{background:repeating-linear-gradient(0deg,transparent 0 110px,var(--fg) 110px 112px,var(--panel) 112px 120px,var(--fg) 120px 122px,transparent 122px 240px);opacity:0}
.lyr.fr.m::after{opacity:.9}
.lyr.lc{background-color:var(--panel);transform:translateZ(15px)}
.lyr.lc::after{background-image:linear-gradient(90deg,var(--fg) 1px,transparent 1px),linear-gradient(0deg,var(--fg) 1px,transparent 1px);background-size:80px 40px;opacity:.3}
.stage.ex .bld{transform:translateX(120px) translateZ(-230px) rotateX(12deg) rotateY(-58deg) scale(.8)}
.stage:not(.ex) .bld{transform:scale(1.12)}
.stage.ex .lyr.wl{transform:translateZ(0)}
.stage.ex .lyr.in{transform:translateZ(140px)}
.stage.ex .lyr.fr{transform:translateZ(280px)}
.stage.ex .lyr.lc{transform:translateZ(420px)}
.stage.hl-fr .lyr:not(.fr){opacity:.35}
.lbl{position:absolute;font-size:12.5px;line-height:1.3;background:var(--bg);padding:5px 9px;border-left:2px solid var(--fg);opacity:0;pointer-events:none;transition:opacity .4s .9s;white-space:nowrap}
.lbl a{pointer-events:auto;cursor:pointer;text-decoration:underline}
.stage.ex .lbl{opacity:1}
.seg{position:absolute;left:0;bottom:8px;display:flex;border:1px solid var(--fg);z-index:3;background:var(--bg)}
.seg button{border:0;background:none;padding:8px 14px;font:500 13px Geologica,system-ui,sans-serif;cursor:pointer;color:var(--fg)}
.seg button.on{background:var(--fg);color:var(--on)}
.sinfo{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.sinfo h4{margin:0;font-size:22px;font-weight:300;line-height:1.25}
.sinfo p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.stg-main{min-width:0}
.hero2{display:grid;grid-template-columns:5fr 7fr;gap:32px;align-items:center;margin-top:12px}
.hero2 h1{font-size:clamp(34px,4.6vw,62px);line-height:1.03}
.hero2 p.lead{margin:18px 0 26px;font-size:17px;color:var(--mut)}
@media(max-width:900px){.stage{grid-template-columns:1fr}.hero2{grid-template-columns:1fr}.scene{height:460px}.bld{transform-origin:50% 50%}}
@media(prefers-reduced-motion:reduce){.bld,.lyr{transition:none}}
@media(max-width:820px){.row{grid-template-columns:1fr;gap:16px}.rh{position:static}.mg3{grid-template-columns:1fr}.cont{display:none}.hero .plate{position:static;padding:24px 0}.hero+.rows{margin-top:10px}.bar{flex-wrap:wrap;gap:0}.nv .nl{padding:14px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.hero2 .stage .scene{overflow:hidden}
.stage.one{grid-template-columns:1fr}.stage.one .rail,.stage.one .sinfo{display:none}.stage.one .scene{height:500px}
.lead3{font-size:18px;color:var(--mut);margin:14px 0 0;max-width:760px}
.pass{display:grid;grid-template-columns:7fr 5fr;gap:36px;align-items:start;margin:22px 0 10px}
.pp{border:1px solid var(--fg);padding:24px 26px;position:sticky;top:90px}
.pp h4{margin:0 0 14px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pp .pr{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.pp .pr span{color:var(--mut);font-size:13px}
.pp .pr a{cursor:pointer;text-decoration:underline}
.pp .btns{margin-top:18px}
.pb{display:block;height:10px;background:var(--panel)}
.spec .pr{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.spec .pr span{color:var(--mut)}
.cds{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.cds .plus{font-size:28px;font-weight:300;color:var(--mut)}
.cd{display:block;width:230px;cursor:pointer;color:var(--fg);text-decoration:none}
.cd .ph{aspect-ratio:4/3}
.cd b{display:block;font-weight:500;font-size:14px;margin-top:8px;line-height:1.3}
.cd small{color:var(--mut);font-size:12.5px}
.cd:hover b{text-decoration:underline}
.cds.sm .cd{width:170px}.cds.sm .cd b{font-size:13px}
.schem{position:relative}
.schem .ph{aspect-ratio:16/6;min-height:210px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px;margin-top:14px;font-size:13.5px}
.legend div{display:flex;gap:10px;align-items:center}
.legend em{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--fg);font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}
.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.uses div .ph{aspect-ratio:3/2}.uses b{display:block;margin-top:8px;font-weight:500;font-size:14px}
.colors{display:flex;gap:8px;flex-wrap:wrap}.colors u{width:54px;height:54px;border:1px solid var(--line)}
.cgrp{margin:0 0 6px;font-size:12.5px;color:var(--mut)}
.lay{display:flex;flex-direction:column;gap:0;max-width:520px}
.lay div{display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13.5px;border:1px solid var(--fg);margin-top:-1px}
.lay div i{font-style:normal;color:var(--mut);font-size:12.5px}
/* ---- разрез стены (НФС) */
.sect{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
.sv{position:relative;display:flex;height:380px;margin-top:34px}
.sv>div{position:relative;border:1px solid var(--fg);margin-left:-1px;--ln:#8d949b}
.sv .s1{flex:0 0 110px;background-color:var(--panel)}
.sv .s2{flex:0 0 86px;background-color:var(--ins);background-image:radial-gradient(var(--dot) 1.6px,transparent 2px);background-size:9px 9px}
.sv .s3{flex:0 0 90px;background:var(--bg)}
.sv .s3::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:repeating-linear-gradient(0deg,transparent 0 52px,var(--fg) 52px 56px)}
.sv .s3::after{content:"";position:absolute;left:22px;top:0;bottom:0;width:3px;background:var(--fg)}
.sv .s4{flex:0 0 26px;background-color:var(--panel);transition:background .2s}
.sv b{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;border:1px solid var(--fg);background:var(--bg);font-size:12px;font-weight:400;display:flex;align-items:center;justify-content:center}
.sv .out{position:absolute;right:-44px;top:50%;font-size:12px;color:var(--mut);transform:rotate(90deg);transform-origin:left top;white-space:nowrap}
.sright h4{margin:0;font-size:24px;font-weight:300;line-height:1.25}
.sright p{margin:4px 0 16px;color:var(--mut);font-size:13.5px}
.sleg{display:grid;gap:0;margin:0 0 22px;padding:0;list-style:none}
.sleg li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.sleg em{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--fg);font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}
.sleg a{cursor:pointer;text-decoration:underline}
.sysg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:30px}
.sysg button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:none;padding:8px;font:12.5px/1.3 Geologica,system-ui,sans-serif;cursor:pointer;color:var(--fg)}
.sysg button:hover,.sysg button.on{border-color:var(--fg)}
.sysg u{flex:none;width:34px;height:34px;background-color:var(--panel);--ln:#aab0b6}
/* ---- матрица каркасов */
.mx{display:grid;grid-template-columns:150px repeat(4,1fr);gap:8px;align-items:stretch}
.mx .ch{font-size:12.5px;color:var(--mut);padding:0 4px 6px;align-self:end;line-height:1.3}
.mx .rhd{font-size:14px;font-weight:500;display:flex;align-items:center;line-height:1.3;padding-right:8px}
.mx .rhd small{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:3px}
.mc2{border:1px solid var(--line);background:none;cursor:pointer;padding:14px;text-align:left;font:500 14px Geologica,system-ui,sans-serif;color:var(--fg);display:flex;flex-direction:column;gap:14px;min-height:190px;justify-content:space-between}

 reqs:()=>`<div class="cgrid"><div class="spec">${prow([['Адрес','Санкт-Петербург, адрес'],['Телефон','+7 (000) 000-00-00'],['Почта','info@mail.ru'],['Режим работы','Пн–Пт, 9:00–18:00'],['Реквизиты',bar(60)]])}</div><div class="ph"><span>Карта проезда</span></div></div>`};
const D={
 light:i=>{const L=LGT[i];return [['Где применяют','Типы объектов, для которых это направление',null,{raw:uses(L.use.slice(0,6))}],['Варианты исполнения','',null,{raw:serHTML(L,i),wide:1}]].concat(L.obj?[['Где уже работает','Объекты: '+L.obj,null,{raw:cards([['objs',L.obj.split(' · ')[0],'Объект']]),go:[['objs','Все объекты']]}]]:[]).concat([['Другие направления','Соседние направления',null,{raw:strip('light',i)}],FORM])},
 nfs:i=>[['Из чего собирается','Облицовка и металлокаркас, из которых собрана система',null,{raw:cardsPlus([[null,CLD[i],'Облицовка'],['met-1',MET[1],'Металлокаркас']])}],['Как крепится','Схема узла: способ крепления панели к каркасу',null,{raw:schem('Схема узла',['Облицовка','Крепёж','Профиль каркаса','Кронштейн','Утеплитель'])}],['Где применять','Типы зданий и условия',null,{raw:uses(['Жилые здания','Общественные здания','Промышленные объекты'])}],['Параметры','Толщина, вес, размеры',null,{raw:'<div class="spec">'+prow([['Толщина',bar(30)],['Размеры панели',bar(50)],['Вес, кг/м²',bar(35)],['Высота здания',bar(45)]])+'</div>'}],['Объект с этой системой','Фото объекта и подпись',null,{raw:cards([['objs','Название объекта','Город']]) ,go:[['objs','Все объекты']]}],['Другие системы','Соседние системы',null,{raw:strip('nfs',i)}],FORM],
 met:i=>[['Схема узла','Кронштейн, профиль, анкер, прокладка, крепитель утеплителя',null,{raw:schem('Схема узла',['Кронштейн','Профиль','Анкер','Прокладка','Крепитель утеплителя'])}],['Материал и исполнение','Сталь оцинкованная, коррозионно-стойкая или алюминий',null,{raw:'<div class="spec">'+prow([['Материал',MATS[MATIDX[i]]],['Толщина профиля',bar(30)],['Защитное покрытие',bar(45)]])+'</div>'}],['С какими системами работает','Системы, в которых используется этот каркас',null,{raw:cards([['nfs-0',NFS[0],'Система'],['nfs-4',NFS[4],'Система'],['nfs-7',NFS[7],'Система']])}],['Где применять','Высота здания, тип стены, межэтажные перекрытия',null,{raw:uses(['Низкие здания','Высотные здания','Перекрытия'])}],['Другие каркасы','Соседние каркасы',null,{raw:strip('met',i)}],FORM],
};
const col=(k,t,arr)=>`<div class="mc"><a class="mh" onclick="go('${k}')">${t}</a>${arr.map((x,j)=>`<a onclick="go('${k}-${j}')">${x}</a>`).join('')}</div>`;
function nav(act){
 const s=(k,l,to)=>`<div class="nv ${act===k?'on':''}"><a class="nl" tabindex="0" onclick="go('${to}')">${l}</a></div>`;
 return `<div class="nv ${act==='nfs'?'on':''}"><a class="nl" tabindex="0" onclick="go('nfs')">Фасады</a><div class="mega"><div class="wrap mg2">${col('nfs','Навесные фасадные системы',NFS)}<div class="mc" style="margin-top:22px"><a class="mh" onclick="go('design')">${DES}</a></div></div></div></div>
 <div class="nv ${act==='met'?'on':''}"><a class="nl" tabindex="0" onclick="go('met')">Металлокаркасы</a><div class="mega"><div class="wrap mg2">${col('met','Металлокаркасы',MET)}</div></div></div>
 <div class="nv ${act==='light'?'on':''}"><a class="nl" tabindex="0" onclick="go('light')">Освещение FOS</a><div class="mega"><div class="wrap mg2">${col('light','Светильники FOS Group',LNAMES)}</div></div></div>`+s('objs','Объекты','objs')+s('contacts','Контакты','contacts')}
const GRP={design:'nfs',nfs:'nfs',met:'met',light:'light',objs:'objs',contacts:'contacts',home:'',map:''};

function theme(set){const r=document.documentElement;const d=set||(r.getAttribute('data-theme')==='dark'?'light':'dark');r.setAttribute('data-theme',d);try{localStorage.setItem('kr-theme',d)}catch(e){}themeBtn()}
function themeBtn(){const b=$('#tg');if(b)b.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀ Светлая тема':'☾ Тёмная тема'}
function toggleMenu(){const h=document.querySelector('header');h.classList.toggle('menu');$('.burger').textContent=h.classList.contains('menu')?'✕':'☰'}
function mobNav(){const g=(k,t,a)=>`<details class="sub"><summary>${t}</summary><a onclick="go('${k}')">Все разделы: ${t}</a>${a.map((x,j)=>`<a onclick="go('${k}-${j}')">${x}</a>`).join('')}</details>`;
 return `<div class="wrap">${g('nfs','Фасады',NFS).replace('class="sub"','').replace('</details>',`<a onclick="go('design')">${DES}</a></details>`)}${g('met','Металлокаркасы',MET).replace('class="sub"','')}<details><summary>Освещение FOS</summary><a onclick="go('light')">Все направления</a>${LNAMES.map((x,j)=>`<a onclick="go('light-${j}')">${x}</a>`).join('')}</details><a class="top" onclick="go('objs')">Объекты</a><a class="top" onclick="go('contacts')">Контакты</a></div>`}

function go(id){location.hash=id;const h=document.querySelector('header');menuClose(true);h.classList.remove('menu');const bu=$('.burger');if(bu)bu.textContent='☰';if(document.activeElement)document.activeElement.blur()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.style.display='none',2200)}
const STG={
 nfs:{items:NFS.map((n,i)=>({n,sub:'Облицовка '+CLD[i]})),to:'nfs',clad:1},
 met:{items:MET.map(n=>({n,sub:'Решётка каркаса на фасаде'})),to:'met',frame:1,ex:1}};
const WINS=()=>[40,160,280].map(t=>[40,200].map(l=>`<div class="win" style="left:${l}px;top:${t}px"></div>`).join('')).join('');
function stageHTML(k,cmp,one){const S=STG[k];const isOne=one!==undefined;
 const rail=S.items.map((it,i)=>`<button class="sw ${i===0?'on':''}" onmouseenter="stg('${k}',${i})" onfocus="stg('${k}',${i})" onclick="go('${S.to}-${i}')"><u class="p${i%10}"></u><span>${it.n}</span></button>`).join('');
 const gl=[1,4,7].map(r=>[1,5].map(c=>`<div class="gl" style="left:${c*40}px;top:${r*40}px"></div>`).join('')).join('');
 return `<div class="stage ${cmp?'cmp':''} ${isOne?'one':''} ${S.ex?'ex hl-fr':''}" data-k="${k}" data-one="${isOne?one:0}"><div class="rail">${rail}</div><div class="stg-main"><div class="scene"><div class="seg"><button class="${S.ex?'':'on'}" onclick="stgMode('${k}',0)">Фасад</button><button class="${S.ex?'on':''}" onclick="stgMode('${k}',1)">В разрезе</button></div>
 <div class="bld"><div class="lyr wl p7">${WINS()}</div><div class="lyr in">${WINS()}</div><div class="lyr fr" style="--fw:1px">${WINS()}</div><div class="lyr lc p0">${WINS()}</div></div>
 <div class="lbl" data-l="3">Облицовка · 10 видов</div><div class="lbl" data-l="2"><a onclick="go('met')">Металлокаркас</a> · 7 видов</div><div class="lbl" data-l="1">Утеплитель</div><div class="lbl" data-l="0">Стена здания</div></div>
 <div class="sinfo"><div><h4 class="sn"></h4><p class="ss"></p></div><button class="btn alt sgo">Открыть страницу</button></div></div></div>`}
function stg(k,i){const el=document.querySelector('.stage[data-k="'+k+'"]');if(!el)return;const S=STG[k],it=S.items[i];
 el.querySelectorAll('.sw').forEach((e,j)=>e.classList.toggle('on',j===i));
 el.querySelector('.sn').textContent=it.n;el.querySelector('.ss').textContent=it.sub;
 el.querySelector('.sgo').onclick=()=>go(S.to+'-'+i);
 if(S.clad){el.querySelector('.lyr.lc').className='lyr lc p'+(i%10)}
 if(S.frame){const f=el.querySelector('.lyr.fr');f.classList.toggle('m',i>=4);f.style.setProperty('--fw',(1+i%4*.7)+'px')}}
function stgLbl(el){const sc=el.querySelector('.scene').getBoundingClientRect();
 el.querySelectorAll('.lbl').forEach(l=>{const L=el.querySelectorAll('.lyr')[+l.dataset.l].getBoundingClientRect();l.style.left=Math.min(L.right-sc.left+8,sc.width-l.offsetWidth-4)+'px';l.style.top=(L.top-sc.top+10+(3-(+l.dataset.l))*30)+'px'})}
function stgMode(k,ex){const el=document.querySelector('.stage[data-k="'+k+'"]');el.classList.toggle('ex',!!ex);el.classList.toggle('hl-fr',!!ex&&k==='met');
 el.querySelectorAll('.seg button').forEach((b,j)=>b.classList.toggle('on',j===ex));setTimeout(()=>stgLbl(el),ex?1600:0)}
function pickInit(){if($('#scn')){lightPick(1);setTimeout(()=>lightNight(1),500)}if($('#sph'))serPick(0);if($('#sv'))sectPick(0);if($('#mn'))mxPick(0)}
function stgInit(){document.querySelectorAll('.stage').forEach(el=>{const k=el.dataset.k;stg(k,+el.dataset.one||0);
 if(STG[k].ex){setTimeout(()=>stgLbl(el),1600);return}
 el.classList.add('ex');el.querySelectorAll('.seg button').forEach((b,j)=>b.classList.toggle('on',j===1));
 setTimeout(()=>{el.classList.remove('ex');el.querySelectorAll('.seg button').forEach((b,j)=>b.classList.toggle('on',j===0))},700)})}
function blocks(t){return '<div class="rows">'+t.b.map(b=>{
 const ex=b.find(x=>x&&typeof x==='object'&&!Array.isArray(x))||{};
 const txt=b.slice(1).filter(x=>typeof x==='string');
 const isForm=b[0]===FORM[0];
 let body='';
 if(ex.tiles)body+=`<div class="tiles ${ex.big?'lg':''} ${ex.c4?'c4':''} ${ex.c5?'c5':''}">${ex.tiles.map((x,j)=>`<a class="tl" tabindex="0" onclick="go('${ex.to}-${j}')"><div class="ph ${ex.big?'tall':''}"><span>${ex.lbl||'Фото'}</span></div><div class="cap">${x}</div></a>`).join('')}</div>`;
 if(ex.sec)body+=`<div class="lists">${ex.sec.map(([n,l,to])=>`<div><h4 onclick="go('${to}')">${n}</h4>${l.map((x,j)=>`<a onclick="go('${to}-${j}')">${x}</a>`).join('')}</div>`).join('')}</div>`;
 if(ex.stage)body+=stageHTML(ex.stage);
 if(ex.raw)body+=ex.raw;
 if(ex.fn)body+=FN[ex.fn]();
 if(ex.scene)body+=lightScene();
 if(ex.sect)body+=sectHTML();
 if(ex.matrix)body+=matrixHTML();
  if(ex.chips)body+=`<div class="chips">${ex.chips.map(([a,d])=>`<div><div class="ph"><span>Фото</span></div><div class="cap"><b>${a}</b>${d}</div></div>`).join('')}</div>`;
 if(ex.go&&ex.go.length)body+=`<div class="btns">${ex.go.map(([x,l])=>`<button class="btn alt" onclick="go('${x}')">${l}</button>`).join('')}</div>`;
 if(ex.text)body+=`<p class="txt">${ex.text}</p>`;
 if(isForm)body+=`<div class="inl"><div><h2>Оставьте заявку</h2><p>Перезвоним в течение рабочего дня</p><div class="cl"><b>+7 (000) 000-00-00</b><br>info@mail.ru<br>Санкт-Петербург</div></div><div class="fgr"><input placeholder="Имя"><input placeholder="Телефон"><input placeholder="Компания"><textarea placeholder="Комментарий" rows="3"></textarea><label class="ck"><input type="checkbox"> Согласен на обработку персональных данных</label><button class="btn" onclick="sent(this)">Отправить</button></div></div>`;
 const bodyTxt=(!body&&txt[0])?'':'';
 const nohd=isForm||ex.wide||ex.scene||ex.stage||ex.sect||ex.matrix||ex.acc||(ex.text&&!ex.tiles);
 return `<section class="row ${body?'':'solo'} ${ex.wide?'wide':''} ${nohd?'nohd':''}"><div class="rh"><h3>${b[0]}</h3>${txt[0]?`<p class="note">${txt[0]}</p>`:''}${txt[1]?`<p class="note how">Как работает: ${txt[1]}</p>`:''}</div>${body?`<div class="rb">${body}</div>`:''}</section>`}).join('')+'</div>'}
function pl(n,a,b,c){const m=n%100,d=n%10;return m>10&&m<20?c:d===1?a:d>1&&d<5?b:c}
function mapPage(){
 const secs=[['nfs','Навесные фасадные системы',NFS.concat([DES])],['met','Металлокаркасы',MET],['light','Освещение FOS',LNAMES],['objs','Объекты',null],['contacts','Контакты',null]];
 const n3=secs.reduce((a,x)=>a+(x[2]?x[2].length:0),0),total=1+secs.length+n3;
 const node=(lv,t,to,cnt)=>`<span class="nd l${lv}" onclick="go('${to}')"><i>${lv}</i>${t}${cnt?`<em>${cnt}</em>`:''}</span>`;
 const items=secs.map(([k,t,ch],i)=>`<li${i===secs.length-1?' class="last"':''}>${node(2,t,k,ch?ch.length+' стр.':'')}${ch?`<div class="leaves">${ch.map((x,j)=>node(3,x,x===DES?'design':k+'-'+j)).join('')}</div>`:''}</li>`).join('');
 return `<div class="crumbs"><a onclick="go('home')">← Вернуться к прототипу</a></div><div class="head"><h1>Дерево сайта: ${total} ${pl(total,'страница','страницы','страниц')}</h1></div>
 <p class="tn">Три уровня: главная, ${secs.length} разделов, ${n3} ${pl(n3,'страница','страницы','страниц')} внутри разделов. До любой страницы два клика от главной. Форма «Связаться» — всплывающее окно, отдельной страницы у неё нет</p>
 <div class="tree"><div class="root">${node(1,'Главная','home','')}</div><ul>${items}</ul></div>`}
function render(){
 const raw=location.hash.slice(1);const m=raw.match(/^(nfs|met|light)-(\d+)$/);
 if(m&&NAMES[m[1]][+m[2]]!==undefined){const k=m[1],i=+m[2],sec=SEC[k];
  $('#nav').innerHTML=nav(GRP[k]);
  const t={b:D[k](i)};
  const crumbs=`<div class="crumbs"><a onclick="go('home')">Главная</a> › <a onclick="go('${sec[0]}')">${sec[1]}</a> › ${NAMES[k][i]}</div><div class="head"><h1>${NAMES[k][i]}</h1></div>`;
  if(k==='light')$('#app').innerHTML=crumbs+`<p class="lead3">${LGT[i].lead}</p><div class="pass"><div class="lamp"><div class="ph"><span>Фото светильника</span></div><div class="glow"></div></div><div class="pp"><h4>Условия работы</h4>${prow(lightPass(i))}</div></div><p class="note">Первый экран: фото светильника и условия, в которых он работает: защита, температура, срок службы, гарантия. Ниже — где применяют, серии, объекты</p>`+blocks(t);
  else $('#app').innerHTML=crumbs+`<p class="lead3">${LEAD3[k](i)}</p><div class="pass"><div>${stageHTML(k,0,i)}</div><div class="pp"><h4>Паспорт</h4>${prow(PASS[k](i))}</div></div><p class="note">Первый экран: слева показано, как продукт выглядит на фасаде (кнопка «В разрезе» раскладывает фасад на слои), справа — паспорт с главными параметрами. Ниже — блоки страницы по порядку</p>`+blocks(t);
  if(k==='nfs'&&false){}
  scrollTo(0,0);stgInit();pickInit();return}
 const h=raw;const id=h==='map'||T[h]?h:'home';
 $('#nav').innerHTML=nav(GRP[id]);
 if(id==='map'){$('#app').innerHTML=mapPage();scrollTo(0,0);return}
 const t=T[id];
 if(id==='home'){
  $('#app').innerHTML=`<div class="fullbleed hero3"><div class="h3in"><div><h1>Навесные фасадные системы Краспан на Северо-Западе</h1><p class="lead">Официальный представитель</p></div><div>${stageHTML('nfs',1)}</div></div></div><p class="note">Первый экран: фасад собирается из слоёв при загрузке. Наведение на значок меняет облицовку, клик открывает страницу системы. Кнопка «В разрезе» раскладывает фасад на стену, утеплитель, каркас и облицовку</p>`+blocks({b:t.b.slice(1)});
 }else{
  $('#app').innerHTML=`<div class="crumbs"><a onclick="go('home')">Главная</a> › ${''}${t.t}</div><div class="head"><h1>${t.t}</h1></div><p class="note">Цель страницы: ${t.goal}</p>`+blocks(t);
 }
 scrollTo(0,0);stgInit();pickInit()}
function form(){
 $('#modal').innerHTML=`<h2>Связаться с нами</h2><div class="fld">Имя</div><div class="fld">Телефон</div><div class="fld">Компания</div><div class="fld">Комментарий</div><div class="fld">☐ Согласие на обработку данных</div><button class="btn" onclick="thanks()">Отправить</button> <button class="btn alt" onclick="closeF()">Закрыть</button>`;
 $('#ov').classList.add('show')}

function closeF(){$('#ov').classList.remove('show')}

/* Выпадающее меню: hover-intent, чтобы не мигало и не закрывалось от случайного движения мыши */
let __nvOpen=null,__tO,__tC,__lock=null;
function menuSet(n){if(__nvOpen===n)return;if(__nvOpen)__nvOpen.classList.remove('open');__nvOpen=n;if(n)n.classList.add('open')}
function menuClose(lock){clearTimeout(__tO);clearTimeout(__tC);if(lock){const hv=document.querySelector('header .nv:hover');__lock=hv?hv.querySelector('.nl').textContent:'*'}document.querySelectorAll('header .nv.open').forEach(x=>x.classList.remove('open'));__nvOpen=null}
(function(){const hd=document.querySelector('header');
 const lab=n=>n.querySelector('.nl').textContent;
 const later=(fn,ms)=>setTimeout(fn,ms);
 hd.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const n=e.target.closest('.nv');
  if(__lock){if(n&&__lock!=='*'&&lab(n)!==__lock)__lock=null;else return}
  clearTimeout(__tC);
  if(n&&n.querySelector('.mega')){if(n===__nvOpen){clearTimeout(__tO);return}clearTimeout(__tO);__tO=later(()=>menuSet(n),__nvOpen?60:90)}
  else{clearTimeout(__tO);if(__nvOpen)__tC=later(()=>menuSet(null),120)}});
 hd.addEventListener('pointerleave',e=>{if(e.pointerType!=='mouse')return;__lock=null;clearTimeout(__tO);clearTimeout(__tC);__tC=later(()=>menuSet(null),180)});
 hd.addEventListener('click',e=>{const l=e.target.closest('.nv > .nl');if(!l)return;const n=l.parentNode;if(n.querySelector('.mega')&&!l.getAttribute('onclick')){clearTimeout(__tO);menuSet(__nvOpen===n?null:n)}});
 hd.addEventListener('focusin',e=>{if(__lock)return;const n=e.target.closest('.nv');if(n&&n.querySelector('.mega')){clearTimeout(__tC);menuSet(n)}});
 hd.addEventListener('focusout',e=>{if(!hd.contains(e.relatedTarget))menuSet(null)});
 addEventListener('keydown',e=>{if(e.key==='Escape'){menuClose(false)}});
})();
addEventListener('hashchange',render);render();$('#mnav').innerHTML=mobNav();themeBtn();
</script>
